x;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#47574c}.field input,.field textarea,.field select,.filters input,.filters select{border:1px solid #dbe2d9;background:#fff;border-radius:9px;padding:11px 12px;color:var(--ink);width:100%;min-width:0}.field textarea{resize:vertical;min-height:100px}.field small,.hint{color:var(--muted);font-size:11px;line-height:1.5}.filters button{align-self:end}.tabs{display:flex;gap:7px;margin:13px 0 17px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:100px;background:#fff;color:#4a5b50;padding:8px 13px;font-size:12px;font-weight:700}.chip.active{background:var(--forest);border-color:var(--forest);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.item-card{border:1px solid var(--line);border-radius:17px;background:#fff;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;min-width:0}.item-card:hover{transform:translateY(-2px);box-shadow:0 18px 38px #18271c13}.card-visual{height:140px;background:linear-gradient(135deg,#e2eadc,#f0e9dc);display:grid;place-items:center;position:relative;overflow:hidden}.card-visual img{width:100%;height:100%;object-fit:cover}.card-emoji{font-size:54px;filter:drop-shadow(0 7px 7px #3332)}.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:100px;background:#fff;color:var(--forest);font-size:10px;font-weight:800;box-shadow:0 3px 10px #0001}.badge.lost{background:#fff0dc;color:#895322}.badge.status{left:auto;right:11px;background:#eff5ec}.card-body{padding:16px;display:flex;flex-direction:column;flex:1}.category{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#718174;font-weight:800}.card-body h3{font-size:16px;line-height:1.35;margin:7px 0 7px;letter-spacing:-.2px}.card-body p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 15px}.meta{display:grid;gap:7px;color:#66746b;font-size:11px;margin-top:auto;padding-top:9px}.meta span{display:flex;align-items:center;gap:7px}.card-actions{display:flex;gap:7px;margin-top:15px}.card-actions .btn{flex:1}.empty{grid-column:1/-1;text-align:center;border:1px dashed #cad5c9;border-radius:15px;padding:48px 15px;color:var(--muted);background:#ffffffaa}.empty strong{display:block;color:var(--ink);font-size:16px;margin:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:23px;box-shadow:var(--shadow)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field.full{grid-column:1/-1}.radio-row{display:flex;gap:10px}.radio-option{flex:1;border:1px solid var(--line);padding:13px;border-radius:11px;display:flex;gap:10px;align-items:center;font-size:13px}.radio-option:has(input:checked){border-color:#67826e;background:#f1f6ee}.form-actions{display:flex;justify-content:end;gap:9px;margin-top:20px}.page-title{margin:0 0 7px;font-size:29px;letter-spacing:-.8px}.page-desc{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.55}.notice{padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5;margin:12px 0}.notice.info{background:#edf4eb;color:#375c3c}.notice.warn{background:#fff3df;color:#80592b}.notice.error{background:#fbebeb;color:#963c3c}.notice.success{background:#e9f5e9;color:#286539}.records{display:grid;gap:11px}.record{border:1px solid var(--line);background:white;padding:15px;border-radius:13px;display:flex;align-items:center;gap:14px}.record-icon{width:48px;height:48px;border-radius:12px;background:var(--sage2);display:grid;place-items:center;font-size:23px;flex-shrink:0}.record-main{flex:1;min-width:0}.record-main strong{font-size:14px;display:block}.record-main small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.status-pill{display:inline-flex;padding:5px 8px;border-radius:100px;background:#edf3e9;font-size:10px;color:#375943;font-weight:800}.record-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.separator{border:0;border-top:1px solid var(--line);margin:20px 0}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#14231c99;z-index:30;overflow-y:auto}.overlay.show{display:flex}.modal{background:#fff;width:min(620px,100%);border-radius:19px;overflow:hidden;box-shadow:0 25px 80px #07140b44;max-height:92vh;overflow-y:auto}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:15px}.modal-head h2{font-size:20px;margin:0}.modal-head p{font-size:12px;color:var(--muted);margin:6px 0 0}.modal-body{padding:22px}.xbtn{border:0;background:#f0f3ee;border-radius:9px;width:32px;height:32px;font-size:20px;color:#435248}.detail-image{height:220px;background:#edf2e9;margin:-22px -22px 18px;display:grid;place-items:center;overflow:hidden}.detail-image img{width:100%;height:100%;object-fit:contain}.detail-image span{font-size:80px}.detail-title{font-size:25px;margin:8px 0;letter-spacing:-.6px}.detail-desc{font-size:13px;line-height:1.7;color:#5f6e64}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}.detail-meta div{background:#f5f7f2;padding:11px;border-radius:10px}.detail-meta small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail-meta strong{font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}.toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#23392d;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 10px 35px #0002;max-width:min(390px,calc(100vw - 44px));font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.bad{background:#933d3d}.foot{border-top:1px solid var(--line);padding:20px;text-align:center;color:#879188;font-size:11px}.demo-label{background:#fff0d8;color:#83551a;font-size:10px;letter-spacing:.7px;font-weight:800;border-radius:6px;padding:6px 8px}.account-list{display:grid;gap:8px}.account-choice{border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:left;background:white;display:flex;align-items:center;gap:10px}.account-choice:hover{background:var(--sage2)}.account-choice strong{font-size:12px;display:block}.account-choice small{font-size:11px;color:var(--muted)}.split-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media(max-width:950px){.topbar{flex-wrap:wrap;gap:12px}.brand{min-width:0;flex:1}.nav{order:3;flex-basis:100%;overflow:auto}.userarea{margin-left:auto}.hero{grid-template-columns:1fr}.hero-art{display:none}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .searchbox{grid-column:1/-1}.filters button{align-self:stretch}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body><div class="shell">
<header class="topbar">
  <div class="brand" onclick="go('explorar')"><div class="brandmark">⌕</div><div class="brandname">encontrei<small>ACHADOS & PERDIDOS</small></div></div>
  <nav class="nav"><button id="nav-explorar" class="active" onclick="go('explorar')">Explorar itens</button><button id="nav-publicar" onclick="go('publicar')">＋ Publicar</button><button id="nav-meus" onclick="go('meus')">Meus registros</button><button id="nav-moderacao" style="display:none" onclick="go('moderacao')">Moderação</button><button id="nav-notificacoes" style="display:none" onclick="go('notificacoes')">Notificações</button><button id="nav-administracao" style="display:none" onclick="go('administracao')">Administração</button></nav>
  <div class="userarea"><span id="user-label" class="userlabel">Visitante</span><button id="login-btn" class="btn btn-primary">Entrar</button></div>
</header>
<main id="main" class="wrap"></main>
<footer class="foot">ENCONTREI · Projeto acadêmico de Achados e Perdidos · Demonstração local com Python + SQLite</footer>
</div><div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div id="modal-content"></div></div></div><div id="toast" class="toast"></div>
<script>
const API=''; let token=localStorage.getItem('enc_token')||''; let currentUser=JSON.parse(localStorage.getItem('enc_user')||'null'); let currentPage='explorar'; let pendingPage=null; let activeType='Todos'; let currentItem=null; let publishPhotos=[];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emojiByCategory={'Garrafas':'🧴','Chaves':'🔑','Eletrônicos':'🎧','Material escolar':'📓','Cartões':'💳','Documentos':'📄','Roupas':'🧥','Acessórios':'🎒','Outros':'📦'};
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opts.headers||{})};let res;try{res=await fetch(API+path,{...opts,headers})}catch(e){throw new Error('Não foi possível acessar o servidor local. Verifique se a janela preta do Encontrei continua aberta.')}let dat={};try{dat=await res.json()}catch(e){}if(!res.ok)throw new Error(dat.error||'Não foi possível concluir a operação.');return dat}
function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3500)}
function userUpdate(){ $('#user-label').textContent=currentUser?currentUser.name:'Visitante';$('#login-btn').textContent=currentUser?'Sair':'Entrar';$('#nav-moderacao').style.display=currentUser&&['Moderador','Administrador'].includes(currentUser.role)?'':'none';$('#nav-notificacoes').style.display=currentUser?'':'none';$('#nav-administracao').style.display=currentUser&&currentUser.role==='Administrador'?'':'none'; }
function setActiveNav(page){['explorar','publicar','meus','moderacao','notificacoes','administracao'].forEach(p=>{const e=$('#nav-'+p);if(e)e.classList.toggle('active',p===page)})}
function go(page){if(page!=='explorar'&&!currentUser){pendingPage=page;openLogin('Entre para acessar essa área.');return}currentPage=page;setActiveNav(page);if(page==='explorar')renderExplore();else if(page==='publicar')renderPublish();else if(page==='meus')renderMy();else if(page==='moderacao')renderModeration();else if(page==='notificacoes')renderNotifications();else if(page==='administracao')renderAdmin()}
function openModal(html){$('#modal-content').innerHTML=html;$('#overlay').classList.add('show');document.body.style.overflow='hidden'}function closeModal(){$('#overlay').classList.remove('show');document.body.style.overflow=''}
function openLogin(message=''){let html=`<div class="modal-head"><div><h2>Entrar no Encontrei</h2><p>Acesse com uma conta de demonstração.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${message?`<div class="notice info">${esc(message)}</div>`:''}<div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="estudante@campus.edu.br" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="login-password" type="password" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="login()">Entrar</button><button class="btn btn-outline" style="width:100%;margin-top:8px" onclick="openRegister()">Criar conta institucional</button><button class="btn btn-outline" style="width:100%;margin-top:8px" onclick="resendVerification()">Reenviar verificação de e-mail</button><hr class="divider"><p class="hint" style="margin-bottom:10px">Ou selecione uma conta de demonstração:</p><div class="account-list"><button class="account-choice" onclick="fillLogin('estudante@campus.edu.br','Estudante@12345')">🎓 <span><strong>Estudante</strong><small>estudante@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('lucas@campus.edu.br','Lucas@12345')">👤 <span><strong>Outro estudante</strong><small>lucas@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('moderador@campus.edu.br','Moderador@12345')">🛡️ <span><strong>Moderador</strong><small>moderador@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('admin@campus.edu.br','Admin@12345')">⚙️ <span><strong>Administrador</strong><small>admin@campus.edu.br</small></span></button></div><p class="hint" style="margin-top:12px">Contas fictícias para apresentação local. As senhas também estão no README.</p></div>`;openModal(html)}
function fillLogin(email,password){$('#login-email').value=email;$('#login-password').value=password;login()}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#login-email').value,password:$('#login-password').value})});token=d.token;currentUser=d.user;localStorage.setItem('enc_token',token);localStorage.setItem('enc_user',JSON.stringify(currentUser));userUpdate();closeModal();toast('Bem-vindo(a), '+currentUser.name+'!');const target=pendingPage||currentPage;pendingPage=null;go(target)}catch(e){toast(e.message,true)}}
async function resendVerification(){const email=$('#login-email')?.value.trim();if(!email){toast('Informe seu e-mail no campo acima para reenviar a verificação.',true);$('#login-email')?.focus();return}try{const d=await api('/api/resend-verification',{method:'POST',body:JSON.stringify({email})});if(d.verification_url&&!d.verification_email_sent){openModal(`<div class="modal-head"><div><h2>Verificação de e-mail</h2><p>${esc(d.message)}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><p>Abra o link abaixo neste computador para ativar a conta:</p><p><a class="btn btn-primary" href="${esc(d.verification_url)}">Verificar meu e-mail</a></p><p class="hint">O link expira em 24 horas e pode ser usado apenas uma vez.</p><button class="btn btn-outline" onclick="openLogin()">Voltar ao login</button></div>`)}else toast(d.message||'Link de verificação reenviado.')}catch(e){toast(e.message,true)}}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch(e){}token='';currentUser=null;localStorage.removeItem('enc_token');localStorage.removeItem('enc_user');userUpdate();toast('Você saiu do sistema.');go('explorar')}
function loginButton(){if(currentUser)logout();else openLogin()}
function visual(item,large=false){const first=(item.photos||[])[0];if(first)return `<div class="${large?'detail-image':'card-visual'}"><img src="${esc(first)}" alt="Foto de ${esc(item.title)}"></div>`;let icon=emojiByCategory[item.category]||'📦';return large?`<div class="detail-image"><span>${icon}</span></div>`:`<div class="card-visual"><span class="card-emoji">${icon}</span><span class="badge ${item.type==='Perdido'?'lost':''}">${item.type==='Achado'?'ENCONTRADO':'PERDIDO'}</span>${item.status!=='Aberto'?`<span class="badge status">${esc(item.status)}</span>`:''}</div>`}
function renderStats(items){const found=items.filter(i=>i.type==='Achado').length,lost=items.filter(i=>i.type==='Perdido').length;return `<div class="stats"><div class="stat"><span class="stat-icon">🔎</span><small>Anúncios ativos</small><strong>${items.length}</strong></div><div class="stat"><span class="stat-icon">🤝</span><small>Itens encontrados</small><strong>${found}</strong></div><div class="stat"><span class="stat-icon">🧭</span><small>Itens perdidos</small><strong>${lost}</strong></div></div>`}
async function renderExplore(){currentPage='explorar';setActiveNav(currentPage);$('#main').innerHTML=`<section class="hero"><div><div class="eyebrow">Comunidade que se ajuda</div><h1>Perdeu algo? Vamos encontrar juntos.</h1><p>Consulte os avisos da comunidade acadêmica, encontre um objeto perdido ou ajude alguém a recuperar o que é importante.</p><button class="btn" onclick="go('publicar')">＋ Publicar um anúncio</button></div><div class="hero-art"><div class="hero-circle">🎒</div></div></section><div id="stats"></div><div class="section-head"><div><h2>Últimos anúncios</h2><p>Busque por objeto, categoria ou local para encontrar uma correspondência.</p></div><span class="demo-label">DEMONSTRAÇÃO LOCAL</span></div><div class="filters"><input class="searchbox" id="q" placeholder="⌕  O que você procura?" onkeydown="if(event.key==='Enter')loadItems()"><select id="f-category"><option value="">Todas as categorias</option><option>Garrafas</option><option>Chaves</option><option>Eletrônicos</option><option>Material escolar</option><option>Cartões</option><option>Documentos</option><option>Roupas</option><option>Acessórios</option><option>Outros</option></select><input id="f-location" placeholder="Local no campus"><input id="date-from" type="date" title="Data inicial" aria-label="Data inicial"><input id="date-to" type="date" title="Data final" aria-label="Data final"><select id="f-status"><option value="Aberto">Em aberto</option><option value="Todos">Todos os anúncios ativos</option></select><button class="btn btn-primary" onclick="loadItems()">Buscar</button></div><div class="tabs"><button class="chip active" id="type-Todos" onclick="setType('Todos')">Todos</button><button class="chip" id="type-Achado" onclick="setType('Achado')">✓ Encontrados</button><button class="chip" id="type-Perdido" onclick="setType('Perdido')">⌕ Perdidos</button></div><div id="items-grid" class="grid"><div class="empty">Carregando anúncios…</div></div>`;try{const cfg=await api('/api/config');$('#f-category').innerHTML='<option value="">Todas as categorias</option>'+cfg.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}catch(e){}await loadItems()}
async function loadItems(){const grid=$('#items-grid');if(!grid)return;grid.innerHTML='<div class="empty">Buscando anúncios…</div>';try{const params=new URLSearchParams();const q=$('#q')?.value.trim();const cat=$('#f-category')?.value;const loc=$('#f-location')?.value.trim();const from=$('#date-from')?.value;const to=$('#date-to')?.value;const status=$('#f-status')?.value||'Aberto';if(q)params.set('q',q);if(cat)params.set('category',cat);if(loc)params.set('location',loc);if(from)params.set('date_from',from);if(to)params.set('date_to',to);if(status)params.set('status',status);if(activeType!=='Todos')params.set('type',activeType);const d=await api('/api/items?'+params.toString());const items=d.items;$('#stats').innerHTML=renderStats(items);grid.innerHTML=items.length?items.map(cardHTML).join(''):`<div class="empty"><div style="font-size:30px">⌕</div><strong>Nenhum anúncio encontrado</strong>Tente mudar os filtros ou publicar um anúncio.<div style="margin-top:15px"><button class="btn btn-soft" onclick="clearFilters()">Limpar filtros</button></div></div>`}catch(e){grid.innerHTML=`<div class="empty"><strong>Não foi possível carregar os anúncios</strong>${esc(e.message)}</div>`}}
function setType(t){activeType=t;document.querySelectorAll('.tabs .chip').forEach(b=>b.classList.remove('active'));$('#type-'+t)?.classList.add('active');loadItems()}
function clearFilters(){['q','f-category','f-location','date-from','date-to'].forEach(id=>{const e=$('#'+id);if(e)e.value=''});$('#f-status').value='Aberto';activeType='Todos';document.querySelectorAll('.tabs .chip').forEach(b=>b.classList.remove('active'));$('#type-Todos').classList.add('active');loadItems()}
function cardHTML(i){const icon=emojiByCategory[i.category]||'📦';const pic=(i.photos||[])[0];return `<article class="item-card"><div class="card-visual">${pic?`<img src="${esc(pic)}" alt="Foto de ${esc(i.title)}">`:`<span class="card-emoji">${icon}</span>`}<span class="badge ${i.type==='Perdido'?'lost':''}">${i.type==='Achado'?'ENCONTRADO':'PERDIDO'}</span>${i.status!=='Aberto'?`<span class="badge status">${esc(i.status)}</span>`:''}</div><div class="card-body"><div class="category">${esc(i.category)}</div><h3>${esc(i.title)}</h3><p>${esc(i.description.length>105?i.description.slice(0,105)+'…':i.description)}</p><div class="meta"><span>⌖ ${esc(i.location)}</span><span>◷ ${formatDate(i.event_date)}</span><span>Publicador: ${esc(i.owner_name||'Comunidade')}</span></div><div class="card-actions"><button class="btn btn-soft" onclick="detail(${i.id})">Ver detalhes</button>${i.type==='Achado'&&['Aberto','No ponto de guarda'].includes(i.status)&&currentUser&&currentUser.id!==i.owner_id?`<button class="btn btn-primary" onclick="claimStart(${i.id})">Reivindicar</button>`:''}</div></div></article>`}
function formatDate(d){if(!d)return 'Data não informada';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
async function detail(id){try{let d=await api('/api/items/'+id);currentItem=d.item;const i=currentItem;const canClaim=currentUser&&currentUser.id!==i.owner_id&&i.type==='Achado'&&['Aberto','No ponto de guarda'].includes(i.status);const own=currentUser&&(currentUser.id===i.owner_id||['Moderador','Administrador'].includes(currentUser.role));openModal(`<div class="modal-head"><div><h2>Detalhes do anúncio</h2><p>Confira as informações do item.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${visual(i,true)}<span class="status-pill">${esc(i.type==='Achado'?'Encontrado':'Perdido')} · ${esc(i.status)}</span><h1 class="detail-title">${esc(i.title)}</h1><span class="category">${esc(i.category)}</span><p class="detail-desc">${esc(i.description)}</p><div class="detail-meta"><div><small>LOCAL</small><strong>⌖ ${esc(i.location)}</strong></div><div><small>DATA</small><strong>${formatDate(i.event_date)}</strong></div><div><small>PUBLICADO POR</small><strong>${esc(i.owner_name||'Comunidade')}</strong></div><div><small>STATUS</small><strong>${esc(i.status)}</strong></div></div><div class="notice info">🔒 Por segurança, perguntas e respostas de verificação são privadas. Dados de contato pessoal não são exibidos.</div><div class="form-actions" style="justify-content:space-between;flex-wrap:wrap"><button class="btn btn-outline" onclick="reportItem(${i.id})">⚑ Denunciar anúncio</button>${currentUser&&currentUser.id!==i.owner_id?`<button class="btn btn-outline" onclick="reportUser(${i.owner_id})">Denunciar perfil</button>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap">${own?`<button class="btn btn-soft" onclick="ownerClaims(${i.id})">Ver reivindicações</button>`:''}${own&&i.status==='Aberto'?`<button class="btn btn-primary" onclick="resolveItem(${i.id})">Marcar resolvido</button>`:''}${canClaim?`<button class="btn btn-primary" onclick="closeModal();claimStart(${i.id})">Solicitar devolução</button>`:''}</div></div></div>`)}catch(e){toast(e.message,true)}}
function requireLogin(message='Entre na sua conta para continuar.'){if(!currentUser){openLogin(message);return false}return true}
async function claimStart(id){if(!requireLogin('Para solicitar a devolução, entre com uma conta de estudante.'))return;try{const d=await api('/api/items/'+id+'/verification-question');openModal(`<div class="modal-head"><div><h2>Solicitar devolução</h2><p>Confirme um detalhe que só o verdadeiro dono deve saber.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice info">A resposta não ficará visível publicamente. Se a resposta estiver correta, o publicador poderá analisar sua solicitação.</div><form onsubmit="submitClaim(event,${id})"><div class="field"><label>Pergunta de verificação</label><div style="padding:14px;background:#f4f6f1;border-radius:10px;font-size:14px;font-weight:700">${esc(d.question)}</div></div><div class="field" style="margin-top:15px"><label>Sua resposta</label><input id="claim-answer" required maxlength="250" placeholder="Digite sua resposta"></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" type="submit">Enviar solicitação</button></div></form></div>`)}catch(e){toast(e.message,true)}}
async function submitClaim(ev,id){ev.preventDefault();try{const d=await api('/api/items/'+id+'/claims',{method:'POST',body:JSON.stringify({answer:$('#claim-answer').value})});closeModal();toast(d.message);if(currentPage==='meus')renderMy()}catch(e){toast(e.message,true)}}
async function reportItem(id){if(!requireLogin('Entre para denunciar um anúncio.'))return;openModal(`<div class="modal-head"><div><h2>Denunciar anúncio</h2><p>A equipe de moderação irá analisar o caso.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><form onsubmit="submitReport(event,${id})"><div class="field"><label>Motivo da denúncia</label><textarea id="report-reason" required minlength="5" maxlength="500" placeholder="Descreva o motivo…"></textarea></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Enviar denúncia</button></div></form></div>`)}
async function submitReport(ev,id){ev.preventDefault();try{const d=await api(`/api/items/${id}/reports`,{method:'POST',body:JSON.stringify({reason:$('#report-reason').value})});closeModal();toast(d.message)}catch(e){toast(e.message,true)}}
async function resolveItem(id){if(!confirm('Marcar este anúncio como resolvido?'))return;try{const d=await api(`/api/items/${id}/resolve`,{method:'POST',body:'{}'});closeModal();toast(d.message);if(currentPage==='explorar')loadItems();else renderMy()}catch(e){toast(e.message,true)}}
async function renderPublish(){currentPage='publicar';setActiveNav(currentPage);publishPhotos=[];$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Publicar um anúncio</h1><p class="page-desc">Ajude a comunidade a encontrar um objeto ou devolver algo que alguém perdeu.</p></div><span class="demo-label">NOVO ANÚNCIO</span></div><div class="panel"><form id="publish-form" onsubmit="submitPublish(event)"><div class="field full"><label>O que aconteceu?</label><div class="radio-row"><label class="radio-option"><input type="radio" name="type" value="Achado" checked onchange="toggleFound()"><span>🔎 <strong>Encontrei um objeto</strong></span></label><label class="radio-option"><input type="radio" name="type" value="Perdido" onchange="toggleFound()"><span>🎒 <strong>Perdi um objeto</strong></span></label></div></div><div class="form-grid" style="margin-top:17px"><div class="field"><label for="p-title">Título do anúncio *</label><input id="p-title" required maxlength="100" placeholder="Ex.: Garrafa térmica verde"></div><div class="field"><label for="p-category">Categoria *</label><select id="p-category" required><option value="">Selecione…</option><option>Garrafas</option><option>Chaves</option><option>Eletrônicos</option><option>Material escolar</option><option>Cartões</option><option>Documentos</option><option>Roupas</option><option>Acessórios</option><option>Outros</option></select></div><div class="field"><label for="p-location">Local no campus *</label><select id="p-location" required><option value="">Selecione…</option></select></div><div class="field"><label for="p-date">Data em que foi visto *</label><input id="p-date" type="date" required></div><div class="field full"><label for="p-description">Descrição *</label><textarea id="p-description" required maxlength="1200" placeholder="Descreva cor, marca e características gerais. Não publique dados pessoais."></textarea><small>Até 1.200 caracteres. Não inclua informações de contato pessoal.</small></div><div class="field full" id="photo-field"><label for="p-photos">Fotos do item (obrigatório para itens achados) *</label><input id="p-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="previewPhotos(event)"><small>Máximo de 3 fotos, 5 MB cada, JPG, PNG ou WEBP.</small><div id="photo-preview" class="photo-preview"></div></div><div id="verification-fields" class="form-grid field full" style="padding:16px;background:#f5f7f2;border-radius:12px"><div class="field full"><label for="p-question">Pergunta de verificação *</label><input id="p-question" maxlength="250" placeholder="Ex.: Qual adesivo está na parte de baixo?"><small>Essa pergunta só será mostrada a quem solicitar a devolução; nunca aparecerá publicamente.</small></div><div class="field full"><label for="p-answer">Resposta esperada *</label><input id="p-answer" maxlength="250" placeholder="Resposta correta"><small>Será armazenada no banco local e não será exibida aos outros usuários.</small></div></div></div><div class="notice warn">Importante: documentos, cartões e eletrônicos devem ser entregues ao ponto de guarda da instituição. Não inclua números de documentos ou outros dados sensíveis na descrição.</div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="go('explorar')">Cancelar</button><button type="submit" class="btn btn-primary">Publicar anúncio</button></div></form></div>`;try{const cfg=await api('/api/config');$('#p-category').innerHTML='<option value="">Selecione…</option>'+cfg.categories.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');$('#p-location').innerHTML='<option value="">Selecione…</option>'+cfg.locations.map(l=>`<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('')}catch(e){toast('Não foi possível carregar categorias e locais.',true)}$('#p-date').value=new Date().toISOString().slice(0,10);toggleFound()}
function toggleFound(){const found=document.querySelector('input[name="type"]:checked').value==='Achado';$('#verification-fields').style.display=found?'grid':'none';$('#p-question').required=found;$('#p-answer').required=found;$('#photo-field').querySelector('label').textContent=found?'Fotos do item (obrigatório para itens achados) *':'Fotos do item (opcional)';}
async function previewPhotos(event){const files=[...event.target.files];if(files.length>3){toast('Selecione no máximo 3 fotos.',true);event.target.value='';publishPhotos=[];$('#photo-preview').innerHTML='';return}publishPhotos=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use fotos JPG, PNG ou WEBP.',true);event.target.value='';publishPhotos=[];return}if(file.size>5*1024*1024){toast('Cada foto deve ter no máximo 5 MB.',true);event.target.value='';publishPhotos=[];return}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});publishPhotos.push({name:file.name,mime:file.type,data});}$('#photo-preview').innerHTML=publishPhotos.map(p=>`<img src="${p.data}" alt="Prévia da foto">`).join('')}
async function submitPublish(ev){ev.preventDefault();const type=document.querySelector('input[name="type"]:checked').value;const payload={title:$('#p-title').value,type,category:$('#p-category').value,location:$('#p-location').value,event_date:$('#p-date').value,description:$('#p-description').value,photos:publishPhotos,verification_question:$('#p-question').value,verification_answer:$('#p-answer').value};try{const d=await api('/api/items',{method:'POST',body:JSON.stringify(payload)});toast(d.message);if(d.matches&&d.matches.length){openModal(`<div class="modal-head"><div><h2>Possíveis correspondências</h2><p>Encontramos ${d.matches.length} anúncio(s) que podem estar relacionados.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="records">${d.matches.map(m=>`<div class="record"><div class="record-main"><strong>${esc(m.title)}</strong><small>${esc(m.category)} · ${esc(m.location)} · ${formatDate(m.event_date)}</small></div><button class="btn btn-soft btn-small" onclick="closeModal();detail(${m.id})">Ver item</button></div>`).join('')}</div><div class="form-actions"><button class="btn btn-primary" onclick="closeModal();go('meus')">Concluir</button></div></div>`)}else{toast('Nenhuma correspondência encontrada.');go('meus')}}catch(e){toast(e.message,true)}}
async function renderMy(){currentPage='meus';setActiveNav(currentPage);$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Meus registros</h1><p class="page-desc">Acompanhe anúncios, solicitações de devolução e histórico.</p></div><button class="btn btn-primary" onclick="go('publicar')">＋ Novo anúncio</button></div><div class="panel" style="margin-bottom:20px"><form class="form-grid" onsubmit="saveEmailPreferences(event)"><div class="field full"><h2 style="font-size:17px;margin:0 0 6px">Preferências de notificação</h2><p class="hint">As notificações no sistema continuam ativas. E-mails reais exigem configurar SMTP antes de iniciar o servidor.</p></div><label class="radio-option field full"><input id="email-pref-enabled" type="checkbox" ${currentUser&&currentUser.email_notifications?'checked':''}> Receber também notificações por e-mail</label><div class="form-actions field full"><button class="btn btn-outline btn-small" type="submit">Salvar preferências</button></div></form></div><div class="panel" style="margin-bottom:20px"><div class="split-head"><h2 style="font-size:17px;margin:0">Meus anúncios</h2><span class="status-pill">Publicações</span></div><div class="records" id="my-items" style="margin-top:15px">Carregando…</div><hr class="separator"><div class="split-head"><h2 style="font-size:17px;margin:0">Minhas reivindicações</h2><span class="status-pill">Solicitações</span></div><div class="records" id="my-claims" style="margin-top:15px">Carregando…</div><hr class="separator"><div class="split-head"><h2 style="font-size:17px;margin:0">Histórico</h2><span class="status-pill">Auditoria</span></div><div class="records" id="my-history" style="margin-top:15px">Carregando…</div></div>`;try{const [a,c,h]=await Promise.all([api('/api/my/items'),api('/api/my/claims'),api('/api/my/history')]);$('#my-items').innerHTML=a.items.length?a.items.map(i=>`<div class="record"><div class="record-icon">${emojiByCategory[i.category]||'📦'}</div><div class="record-main"><strong>${esc(i.title)}</strong><small>${esc(i.type)} · ${esc(i.location)} · ${formatDate(i.event_date)}</small></div><span class="status-pill">${esc(i.status)}</span><div class="record-actions"><button class="btn btn-outline btn-small" onclick="detail(${i.id})">Detalhes</button>${i.status==='Aberto'?`<button class="btn btn-soft btn-small" onclick="editItem(${i.id})">Editar</button><button class="btn btn-soft btn-small" onclick="ownerClaims(${i.id})">Reivindicações</button><button class="btn btn-outline btn-small" onclick="resolveItem(${i.id})">Resolver</button><button class="btn btn-danger btn-small" onclick="deleteItem(${i.id})">Excluir</button>`:''}${i.status==='No ponto de guarda'?`<button class="btn btn-soft btn-small" onclick="ownerClaims(${i.id})">Ver solicitações</button>`:''}</div></div>`).join(''):'<div class="empty">Você ainda não publicou anúncios.</div>';$('#my-claims').innerHTML=c.claims.length?c.claims.map(cl=>`<div class="record"><div class="record-icon">🤝</div><div class="record-main"><strong>${esc(cl.item_title)}</strong><small>${esc(cl.location)} · Solicitação em ${formatDate(cl.created_at.slice(0,10))}${cl.decision_note?' · '+esc(cl.decision_note):''}</small></div><span class="status-pill">${esc(cl.status)}</span>${cl.status==='Aprovada'?`<button class="btn btn-soft btn-small" onclick="openMessages(${cl.id},${cl.item_id})">Abrir conversa</button>`:''}</div>`).join(''):'<div class="empty">Você ainda não fez reivindicações.</div>';$('#my-history').innerHTML=h.history.length?h.history.map(x=>`<div class="record"><div class="record-icon">◷</div><div class="record-main"><strong>${esc(x.title)} — ${esc(x.action)}</strong><small>${esc(x.note||'Sem observações')} · ${esc(x.created_at.replace('T',' '))}</small></div></div>`).join(''):'<div class="empty">Nenhum evento de histórico ainda.</div>'}catch(e){$('#my-items').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function editItem(id){try{const d=await api('/api/items/'+id);const i=d.item;const cfg=await api('/api/config');const categoryOptions=cfg.categories.map(c=>`<option value="${esc(c.name)}" ${c.name===i.category?'selected':''}>${esc(c.name)}</option>`).join('');const locationOptions=cfg.locations.map(l=>`<option value="${esc(l.name)}" ${l.name===i.location?'selected':''}>${esc(l.name)}</option>`).join('');openModal(`<div class="modal-head"><div><h2>Editar anúncio</h2><p>Atualize as informações do item aberto.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><form onsubmit="submitEdit(event,${id})"><div class="field"><label>Título</label><input id="edit-title" required minlength="3" maxlength="100" value="${esc(i.title)}"></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Categoria</label><select id="edit-category" required>${categoryOptions}</select></div><div class="field"><label>Local</label><select id="edit-location" required>${locationOptions}</select></div><div class="field"><label>Data</label><input id="edit-date" type="date" required value="${esc(i.event_date)}"></div><div class="field"><label>Substituir fotos (opcional)</label><input id="edit-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="field full"><label>Descrição</label><textarea id="edit-description" required minlength="5" maxlength="1200">${esc(i.description)}</textarea><small>Se selecionar novas fotos, elas substituirão as atuais; máximo 3 imagens até 5 MB cada.</small></div></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">Salvar alterações</button></div></form></div>`)}catch(e){toast(e.message,true)}}
async function submitEdit(ev,id){ev.preventDefault();try{const files=[...($('#edit-photos').files||[])];let photos=undefined;if(files.length){if(files.length>3)throw new Error('Selecione no máximo 3 fotos.');photos=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Use JPG, PNG ou WEBP.');if(file.size>5*1024*1024)throw new Error('Cada foto deve ter no máximo 5 MB.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});photos.push({name:file.name,mime:file.type,data})}}const payload={title:$('#edit-title').value,category:$('#edit-category').value,location:$('#edit-location').value,event_date:$('#edit-date').value,description:$('#edit-description').value};if(photos!==undefined)payload.photos=photos;const d=await api('/api/items/'+id,{method:'PATCH',body:JSON.stringify(payload)});closeModal();toast(d.message);renderMy()}catch(e){toast(e.message,true)}}
async function deleteItem(id){if(!confirm('Excluir este anúncio? O sistema preserva itens que já possuem reivindicações ou denúncias.'))return;try{const d=await api('/api/items/'+id,{method:'DELETE'});toast(d.message);renderMy()}catch(e){toast(e.message,true)}}
async function reportUser(id){if(!requireLogin('Entre para denunciar um perfil.'))return;openModal(`<div class="modal-head"><div><h2>Denunciar perfil</h2><p>Informe um motivo para análise da moderação.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><form onsubmit="submitUserReport(event,${id})"><div class="field"><label>Motivo da denúncia</label><textarea id="profile-report-reason" minlength="5" maxlength="500" required></textarea></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">Enviar denúncia</button></div></form></div>`)}
async function submitUserReport(ev,id){ev.preventDefault();try{const d=await api('/api/users/'+id+'/reports',{method:'POST',body:JSON.stringify({reason:$('#profile-report-reason').value})});closeModal();toast(d.message)}catch(e){toast(e.message,true)}}
async function ownerClaims(itemId){try{const d=await api(`/api/items/${itemId}/claims`);const item=await api(`/api/items/${itemId}`);openModal(`<div class="modal-head"><div><h2>Reivindicações</h2><p>${esc(item.item.title)}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice info">As respostas de verificação não ficam disponíveis nesta lista. Analise cada solicitação com cuidado.</div><div class="records">${d.claims.length?d.claims.map(c=>`<div class="record"><div class="record-icon">👤</div><div class="record-main"><strong>${esc(c.claimant_name)}</strong><small>Enviada em ${formatDate(c.created_at.slice(0,10))}</small></div><span class="status-pill">${esc(c.status)}</span>${c.status==='Pendente'?`<div class="record-actions"><button class="btn btn-primary btn-small" onclick="decideClaim(${c.id},'Aprovada',${itemId})">Aprovar</button><button class="btn btn-outline btn-small" onclick="decideClaim(${c.id},'Recusada',${itemId})">Recusar</button></div>`:''}${c.status==='Aprovada'?`<button class="btn btn-soft btn-small" onclick="openMessages(${c.id},${itemId})">Conversa</button><button class="btn btn-primary btn-small" onclick="confirmReturned(${c.id},${itemId})">Confirmar devolução</button>`:''}</div>`).join(''):'<div class="empty">Ainda não há reivindicações para este item.</div>'}</div></div>`)}catch(e){toast(e.message,true)}}
async function decideClaim(id,decision,itemId){let note='';if(decision==='Recusada'){note=prompt('Motivo da recusa (opcional):')||''}try{const d=await api(`/api/claims/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);ownerClaims(itemId)}catch(e){toast(e.message,true)}}
async function openMessages(claimId,itemId){try{let d=await api(`/api/claims/${claimId}/messages`);openModal(`<div class="modal-head"><div><h2>Conversa sobre o item</h2><p>Combine a entrega sem compartilhar contato pessoal.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div id="messages-box" class="records">${d.messages.length?d.messages.map(m=>`<div class="record"><div class="record-main"><strong>${esc(m.sender_name)} ${m.sender_id===currentUser.id?'(você)':''}</strong><small>${esc(m.body)} · ${esc(m.created_at.replace('T',' '))}</small></div></div>`).join(''):'<div class="empty">Nenhuma mensagem ainda. Combine aqui a entrega.</div>'}</div><form onsubmit="sendMessage(event,${claimId},${itemId})" style="margin-top:14px"><div class="field"><label>Mensagem</label><textarea id="message-body" maxlength="500" required placeholder="Digite uma mensagem curta…"></textarea></div><div class="form-actions"><button class="btn btn-primary">Enviar mensagem</button></div></form></div>`)}catch(e){toast(e.message,true)}}
async function sendMessage(ev,claimId,itemId){ev.preventDefault();try{const d=await api(`/api/claims/${claimId}/messages`,{method:'POST',body:JSON.stringify({body:$('#message-body').value})});toast(d.message);openMessages(claimId,itemId)}catch(e){toast(e.message,true)}}
async function saveEmailPreferences(ev){ev.preventDefault();try{const enabled=$('#email-pref-enabled').checked;const d=await api('/api/me/preferences',{method:'PATCH',body:JSON.stringify({email_notifications:enabled})});currentUser.email_notifications=enabled;localStorage.setItem('enc_user',JSON.stringify(currentUser));toast(d.message)}catch(e){toast(e.message,true)}}
async function renderModeration(){currentPage='moderacao';setActiveNav(currentPage);if(!currentUser||!['Moderador','Administrador'].includes(currentUser.role)){go('explorar');return}$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Painel de moderação</h1><p class="page-desc">Analise denúncias, reivindicações encaminhadas e itens do ponto de guarda.</p></div><span class="demo-label">MODERAÇÃO</span></div><div class="panel"><h2 style="font-size:17px;margin-top:0">Denúncias de anúncios</h2><div id="reports-list" class="records">Carregando…</div><hr class="separator"><h2 style="font-size:17px">Denúncias de perfis</h2><div id="profile-reports-list" class="records">Carregando…</div><hr class="separator"><h2 style="font-size:17px">Reivindicações para análise</h2><div id="mod-claims-list" class="records">Carregando…</div><hr class="separator"><h2 style="font-size:17px">Registrar item recebido no ponto de guarda</h2><p class="hint">Use este formulário para itens sensíveis ou recebidos fisicamente pela instituição. A publicação exige foto e pergunta de verificação.</p><form onsubmit="submitGuardItem(event)"><div class="form-grid"><div class="field"><label>Título</label><input id="g-title" required minlength="3" maxlength="100"></div><div class="field"><label>Categoria</label><select id="g-category" required><option value="">Selecione…</option></select></div><div class="field full"><label>Descrição</label><textarea id="g-description" required minlength="5" maxlength="1200"></textarea></div><div class="field"><label>Ponto de guarda</label><select id="g-point" required onchange="guardPointChanged()"></select></div><div class="field"><label>Data em que foi recebido</label><input id="g-date" type="date" required></div><div class="field full"><label>Foto do item (JPG, PNG ou WEBP; até 5 MB) *</label><input id="g-photos" type="file" accept="image/jpeg,image/png,image/webp" required></div><div class="field"><label>Pergunta de verificação</label><input id="g-question" required minlength="8" maxlength="250"></div><div class="field"><label>Resposta esperada (privada)</label><input id="g-answer" required maxlength="250"></div></div><p id="g-location-label" class="hint"></p><div class="form-actions"><button class="btn btn-primary">Registrar no ponto de guarda</button></div></form><hr class="separator"><h2 style="font-size:17px">Histórico de moderação</h2><div id="moderation-log" class="records">Carregando…</div></div>`;$('#g-date').value=new Date().toISOString().slice(0,10);try{const [r,pr,c,g,l,cfg]=await Promise.all([api('/api/moderation/reports'),api('/api/moderation/profile-reports'),api('/api/moderation/claims'),api('/api/guard-points'),api('/api/moderation/log'),api('/api/config')]);$('#g-category').innerHTML='<option value="">Selecione…</option>'+cfg.categories.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');$('#reports-list').innerHTML=r.reports.length?r.reports.map(x=>`<div class="record"><div class="record-icon">⚑</div><div class="record-main"><strong>${esc(x.item_title)}</strong><small>Denunciado por ${esc(x.reporter_name)} · ${esc(x.reason)}</small></div><div class="record-actions"><button class="btn btn-outline btn-small" onclick="reviewReport(${x.id},'Manter anúncio')">Manter</button><button class="btn btn-danger btn-small" onclick="reviewReport(${x.id},'Ocultar anúncio')">Ocultar</button></div></div>`).join(''):'<div class="empty">Nenhuma denúncia de anúncio pendente.</div>';$('#profile-reports-list').innerHTML=pr.reports.length?pr.reports.map(x=>`<div class="record"><div class="record-icon">👤</div><div class="record-main"><strong>${esc(x.target_name)}</strong><small>Denunciado por ${esc(x.reporter_name)} · ${esc(x.reason)}</small></div><div class="record-actions"><button class="btn btn-outline btn-small" onclick="reviewProfileReport(${x.id},'Improcedente')">Improcedente</button><button class="btn btn-danger btn-small" onclick="reviewProfileReport(${x.id},'Procedente')">Procedente</button></div></div>`).join(''):'<div class="empty">Nenhuma denúncia de perfil pendente.</div>';$('#mod-claims-list').innerHTML=c.claims.length?c.claims.map(x=>`<div class="record"><div class="record-icon">🤝</div><div class="record-main"><strong>${esc(x.item_title)}</strong><small>Solicitante: ${esc(x.claimant_name)} · ${esc(x.item_status)}${x.routed_to_moderation?' · Encaminhada por prazo':''}</small></div><div class="record-actions"><button class="btn btn-primary btn-small" onclick="moderateClaim(${x.id},'Aprovada')">Aprovar</button><button class="btn btn-danger btn-small" onclick="moderateClaim(${x.id},'Recusada')">Recusar</button></div></div>`).join(''):'<div class="empty">Nenhuma reivindicação aguarda análise especializada.</div>';$('#g-point').innerHTML=g.guard_points.map(x=>`<option value="${x.id}" data-location="${esc(x.location_name)}">${esc(x.name)} — ${esc(x.location_name)}</option>`).join('');guardPointChanged();$('#moderation-log').innerHTML=l.actions.length?l.actions.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.action)}${x.item_title?' · '+esc(x.item_title):''}</strong><small>${esc(x.moderator_name)} · ${esc(x.justification)} · ${esc(x.created_at.replace('T',' '))}</small></div></div>`).join(''):'<div class="empty">Ainda não existem ações de moderação registradas.</div>'}catch(e){for(const id of ['reports-list','profile-reports-list','mod-claims-list','moderation-log'])if($('#'+id))$('#'+id).innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function reviewProfileReport(id,decision){const note=prompt('Justificativa obrigatória (mínimo 5 caracteres):');if(!note||note.trim().length<5){toast('Informe uma justificativa de pelo menos 5 caracteres.',true);return}try{const d=await api(`/api/profile-reports/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);renderModeration()}catch(e){toast(e.message,true)}}
async function moderateClaim(id,decision){let note='';if(decision==='Recusada'){note=prompt('Motivo obrigatório da recusa (mínimo 5 caracteres):')||'';if(note.trim().length<5){toast('Informe uma justificativa de pelo menos 5 caracteres.',true);return}}try{const d=await api(`/api/claims/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);renderModeration()}catch(e){toast(e.message,true)}}
function guardPointChanged(){const e=$('#g-point');if(!e||!e.selectedOptions.length)return;$('#g-location-label').textContent='O local será vinculado ao ponto selecionado: '+e.selectedOptions[0].dataset.location;}
async function submitGuardItem(ev){ev.preventDefault();try{const file=$('#g-photos').files[0];if(!file)throw new Error('Selecione uma foto do item.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Use foto JPG, PNG ou WEBP.');if(file.size>5*1024*1024)throw new Error('A foto deve ter no máximo 5 MB.');const photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const loc=$('#g-point').selectedOptions[0]?.dataset.location;if(!loc)throw new Error('Cadastre um ponto de guarda ativo na administração.');const d=await api('/api/guard-points/items',{method:'POST',body:JSON.stringify({title:$('#g-title').value,type:'Achado',category:$('#g-category').value,description:$('#g-description').value,location:loc,event_date:$('#g-date').value,guard_point_id:Number($('#g-point').value),photos:[{name:file.name,mime:file.type,data:photo}],verification_question:$('#g-question').value,verification_answer:$('#g-answer').value})});toast(d.message);renderModeration()}catch(e){toast(e.message,true)}}
async function reviewReport(id,decision){const note=prompt('Justificativa obrigatória para registrar a ação:');if(!note||!note.trim()){toast('Informe uma justificativa para continuar.',true);return}try{const d=await api(`/api/reports/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);renderModeration()}catch(e){toast(e.message,true)}}
function openRegister(){openModal(`<div class="modal-head"><div><h2>Criar conta institucional</h2><p>Cadastro demonstrativo com verificação local do domínio.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><form onsubmit="submitRegister(event)"><div class="field"><label>Nome completo</label><input id="reg-name" minlength="2" maxlength="80" required></div><div class="field" style="margin-top:12px"><label>E-mail institucional</label><input id="reg-email" type="email" maxlength="190" placeholder="seu.nome@campus.edu.br" required></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Senha (mínimo 8 caracteres)</label><input id="reg-password" type="password" minlength="8" maxlength="128" required></div><div class="field"><label>Confirmar senha</label><input id="reg-confirm" type="password" minlength="8" maxlength="128" required></div></div><div class="notice info">No MVP local o link é exibido na tela porque não há um serviço externo de envio de e-mails configurado. Ele expira em 24 horas.</div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="openLogin()">Voltar ao login</button><button class="btn btn-primary">Criar conta</button></div></form></div>`)}
async function submitRegister(ev){ev.preventDefault();try{const d=await api('/api/register',{method:'POST',body:JSON.stringify({name:$('#reg-name').value,email:$('#reg-email').value,password:$('#reg-password').value,password_confirmation:$('#reg-confirm').value})});openModal(`<div class="modal-head"><div><h2>Cadastro criado</h2><p>Falta verificar o e-mail para ativar a conta.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice success">${esc(d.message)}</div><p class="hint">Este link é somente para demonstração local e expira em 24 horas.</p><p><a href="${esc(d.verification_url)}" target="_blank" rel="noopener">Verificar e ativar minha conta</a></p><div class="form-actions"><button class="btn btn-primary" onclick="closeModal();openLogin()">Ir para login</button></div></div>`)}catch(e){toast(e.message,true)}}
async function confirmReturned(claimId,itemId){if(!confirm('Confirmar que o item foi devolvido ao dono?'))return;try{const d=await api(`/api/claims/${claimId}/returned`,{method:'POST',body:'{}'});closeModal();toast(d.message);if(currentPage==='meus')renderMy();else loadItems()}catch(e){toast(e.message,true)}}
async function renderNotifications(){currentPage='notificacoes';setActiveNav(currentPage);$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Notificações</h1><p class="page-desc">Acompanhe novas reivindicações, mensagens, correspondências e decisões.</p></div><button class="btn btn-outline" onclick="markAllNotifications()">Marcar todas como lidas</button></div><div class="panel"><div id="notifications-list" class="records">Carregando notificações…</div></div>`;try{const d=await api('/api/notifications');$('#notifications-list').innerHTML=d.notifications.length?d.notifications.map(n=>`<div class="record" style="${n.is_read?'opacity:.7':''}"><div class="record-icon">${n.type==='correspondencia'?'🔎':n.type==='mensagem'?'✉️':n.type==='denuncia'?'⚑':'🔔'}</div><div class="record-main"><strong>${esc(n.title)}</strong><small>${esc(n.body)} · ${esc(n.created_at.replace('T',' '))}</small></div>${!n.is_read?`<button class="btn btn-soft btn-small" onclick="markNotification(${n.id})">Marcar lida</button>`:''}${n.item_id?`<button class="btn btn-outline btn-small" onclick="detail(${n.item_id})">Ver item</button>`:''}</div>`).join(''):'<div class="empty"><strong>Nenhuma notificação</strong>Quando houver atualizações, elas aparecerão aqui.</div>'}catch(e){$('#notifications-list').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function markNotification(id){try{await api(`/api/notifications/${id}/read`,{method:'PATCH',body:JSON.stringify({})});renderNotifications()}catch(e){toast(e.message,true)}}
async function markAllNotifications(){try{await api('/api/notifications/read-all',{method:'POST',body:'{}'});toast('Notificações marcadas como lidas.');renderNotifications()}catch(e){toast(e.message,true)}}
async function renderAdmin(){currentPage='administracao';setActiveNav(currentPage);if(!currentUser||currentUser.role!=='Administrador'){toast('Acesso exclusivo à administração.',true);go('explorar');return}$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Administração</h1><p class="page-desc">Gerencie categorias, locais, pontos de guarda, domínios institucionais e contas.</p></div><span class="demo-label">ADMIN</span></div><div class="panel"><h2>Adicionar categoria</h2><form onsubmit="adminAddCategory(event)" class="form-grid"><div class="field"><label>Nome da categoria</label><input id="admin-cat-name" required minlength="2" maxlength="80"></div><label class="radio-option"><input type="checkbox" id="admin-cat-guard"> Requer ponto de guarda</label><div class="form-actions field full"><button class="btn btn-primary">Criar categoria</button></div></form><div id="admin-categories" class="records">Carregando…</div><hr class="separator"><h2>Adicionar local</h2><form onsubmit="adminAddLocation(event)" class="form-grid"><div class="field"><label>Nome</label><input id="admin-location-name" required minlength="2" maxlength="120"></div><div class="field"><label>Bloco/prédio</label><input id="admin-location-block" maxlength="80"></div><div class="form-actions field full"><button class="btn btn-primary">Criar local</button></div></form><div id="admin-locations" class="records">Carregando…</div><hr class="separator"><h2>Adicionar ponto de guarda</h2><form onsubmit="adminAddGuard(event)" class="form-grid"><div class="field"><label>Nome do ponto</label><input id="admin-guard-name" required minlength="2" maxlength="120"></div><div class="field"><label>Local</label><select id="admin-guard-location" required></select></div><div class="field"><label>Referência</label><input id="admin-guard-reference" maxlength="255"></div><div class="field"><label>Prazo de guarda em dias (30–365)</label><input id="admin-guard-days" type="number" min="30" max="365" value="90" required></div><div class="form-actions field full"><button class="btn btn-primary">Criar ponto de guarda</button></div></form><div id="admin-guards" class="records">Carregando…</div><hr class="separator"><h2>Domínios institucionais</h2><form onsubmit="adminAddDomain(event)" class="form-grid"><div class="field"><label>Domínio (sem @)</label><input id="admin-domain-name" required placeholder="alunos.instituicao.br" maxlength="190"></div><div class="form-actions"><button class="btn btn-primary">Adicionar domínio</button></div></form><div id="admin-domains" class="records">Carregando…</div><hr class="separator"><h2>Usuários e permissões</h2><div id="admin-users" class="records">Carregando…</div></div>`;await refreshAdmin()}
async function refreshAdmin(){try{const [c,l,g,d,u]=await Promise.all([api('/api/admin/categories'),api('/api/admin/locations'),api('/api/admin/guard-points'),api('/api/admin/domains'),api('/api/admin/users')]);$('#admin-categories').innerHTML=c.categories.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.name)}</strong><small>${x.requires_guard?'Exige ponto de guarda':'Categoria comum'} · ${x.active?'Ativa':'Inativa'}</small></div><button class="btn btn-outline btn-small" onclick="toggleAdminCategory(${x.id},${!x.active})">${x.active?'Desativar':'Ativar'}</button></div>`).join('');$('#admin-locations').innerHTML=l.locations.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.name)}</strong><small>${esc(x.block_name||'Sem bloco')} · ${x.active?'Ativo':'Inativo'}</small></div><button class="btn btn-outline btn-small" onclick="toggleAdminLocation(${x.id},${!x.active})">${x.active?'Desativar':'Ativar'}</button></div>`).join('');$('#admin-guard-location').innerHTML=l.locations.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#admin-guards').innerHTML=g.guard_points.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.name)}</strong><small>${esc(x.location_name)} · ${x.retention_days} dias · ${x.active?'Ativo':'Inativo'}</small></div><button class="btn btn-outline btn-small" onclick="toggleAdminGuard(${x.id},${!x.active})">${x.active?'Desativar':'Ativar'}</button></div>`).join('');$('#admin-domains').innerHTML=d.domains.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.domain)}</strong><small>${x.active?'Permitido':'Bloqueado'}</small></div><button class="btn btn-outline btn-small" onclick="toggleAdminDomain(${x.id},${!x.active})">${x.active?'Desativar':'Ativar'}</button></div>`).join('');$('#admin-users').innerHTML=u.users.map(x=>`<div class="record"><div class="record-main"><strong>${esc(x.name)}</strong><small>${esc(x.email)} · ${x.email_verified?'E-mail verificado':'Pendente'}</small></div><select id="role-${x.id}" aria-label="Perfil de ${esc(x.name)}"><option ${x.role==='Estudante'?'selected':''}>Estudante</option><option ${x.role==='Moderador'?'selected':''}>Moderador</option><option ${x.role==='Administrador'?'selected':''}>Administrador</option></select><button class="btn btn-soft btn-small" onclick="saveUserRole(${x.id})">Salvar perfil</button><button class="btn btn-outline btn-small" onclick="toggleUserStatus(${x.id},'${x.status==='Ativo'?'Suspenso':'Ativo'}')">${x.status==='Ativo'?'Suspender':'Reativar'}</button></div>`).join('')}catch(e){toast(e.message,true)}}
async function adminAddCategory(e){e.preventDefault();try{await api('/api/admin/categories',{method:'POST',body:JSON.stringify({name:$('#admin-cat-name').value,requires_guard:$('#admin-cat-guard').checked})});toast('Categoria criada.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function adminAddLocation(e){e.preventDefault();try{await api('/api/admin/locations',{method:'POST',body:JSON.stringify({name:$('#admin-location-name').value,block_name:$('#admin-location-block').value})});toast('Local criado.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function adminAddGuard(e){e.preventDefault();try{await api('/api/admin/guard-points',{method:'POST',body:JSON.stringify({name:$('#admin-guard-name').value,location_id:Number($('#admin-guard-location').value),reference:$('#admin-guard-reference').value,retention_days:Number($('#admin-guard-days').value)})});toast('Ponto de guarda criado.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function adminAddDomain(e){e.preventDefault();try{await api('/api/admin/domains',{method:'POST',body:JSON.stringify({domain:$('#admin-domain-name').value})});toast('Domínio adicionado.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function toggleAdminCategory(id,active){try{await api(`/api/admin/categories/${id}`,{method:'PATCH',body:JSON.stringify({active})});refreshAdmin()}catch(e){toast(e.message,true)}}
async function toggleAdminLocation(id,active){try{await api(`/api/admin/locations/${id}`,{method:'PATCH',body:JSON.stringify({active})});refreshAdmin()}catch(e){toast(e.message,true)}}
async function toggleAdminGuard(id,active){try{await api(`/api/admin/guard-points/${id}`,{method:'PATCH',body:JSON.stringify({active})});refreshAdmin()}catch(e){toast(e.message,true)}}
async function toggleAdminDomain(id,active){try{await api(`/api/admin/domains/${id}`,{method:'PATCH',body:JSON.stringify({active})});refreshAdmin()}catch(e){toast(e.message,true)}}
async function saveUserRole(id){try{await api(`/api/admin/users/${id}/role`,{method:'PATCH',body:JSON.stringify({role:$('#role-'+id).value})});toast('Perfil atualizado.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function toggleUserStatus(id,status){if(!confirm((status==='Suspenso'?'Suspender':'Reativar')+' esta conta?'))return;try{await api(`/api/admin/users/${id}/status`,{method:'PATCH',body:JSON.stringify({status})});toast('Status atualizado.');refreshAdmin()}catch(e){toast(e.message,true)}}
async function startup(){userUpdate();if(token){try{const d=await api('/api/me');currentUser=d.user;localStorage.setItem('enc_user',JSON.stringify(currentUser));userUpdate()}catch(e){token='';currentUser=null;localStorage.removeItem('enc_token');localStorage.removeItem('enc_user');userUpdate()}}await renderExplore()}
$('#login-btn').addEventListener('click',loginButton);startup();
</script></body></html>
