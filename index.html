(--line);margin:20px 0}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#14231c99;z-index:30;overflow-y:auto}.overlay.show{display:flex}.modal{background:#fff;width:min(620px,100%);border-radius:19px;overflow:hidden;box-shadow:0 25px 80px #07140b44;max-height:92vh;overflow-y:auto}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:15px}.modal-head h2{font-size:20px;margin:0}.modal-head p{font-size:12px;color:var(--muted);margin:6px 0 0}.modal-body{padding:22px}.xbtn{border:0;background:#f0f3ee;border-radius:9px;width:32px;height:32px;font-size:20px;color:#435248}.detail-image{height:220px;background:#edf2e9;margin:-22px -22px 18px;display:grid;place-items:center;overflow:hidden}.detail-image img{width:100%;height:100%;object-fit:contain}.detail-image span{font-size:80px}.detail-title{font-size:25px;margin:8px 0;letter-spacing:-.6px}.detail-desc{font-size:13px;line-height:1.7;color:#5f6e64}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}.detail-meta div{background:#f5f7f2;padding:11px;border-radius:10px}.detail-meta small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail-meta strong{font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}.toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#23392d;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 10px 35px #0002;max-width:min(390px,calc(100vw - 44px));font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.bad{background:#933d3d}.foot{border-top:1px solid var(--line);padding:20px;text-align:center;color:#879188;font-size:11px}.demo-label{background:#fff0d8;color:#83551a;font-size:10px;letter-spacing:.7px;font-weight:800;border-radius:6px;padding:6px 8px}.account-list{display:grid;gap:8px}.account-choice{border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:left;background:white;display:flex;align-items:center;gap:10px}.account-choice:hover{background:var(--sage2)}.account-choice strong{font-size:12px;display:block}.account-choice small{font-size:11px;color:var(--muted)}.split-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

<body><div class="shell">
<header class="topbar">
  <div class="brand" onclick="go('explorar')"><div class="brandmark">⌕</div><div class="brandname">encontrei<small>ACHADOS & PERDIDOS</small></div></div>
  <nav class="nav"><button id="nav-explorar" class="active" onclick="go('explorar')">Explorar itens</button><button id="nav-publicar" onclick="go('publicar')">＋ Publicar</button><button id="nav-meus" onclick="go('meus')">Meus registros</button><button id="nav-moderacao" style="display:none" onclick="go('moderacao')">Moderação</button></nav>
  <div class="userarea"><span id="user-label" class="userlabel">Visitante</span><button id="login-btn" class="btn btn-primary">Entrar</button></div>
</header>
<main id="main" class="wrap"></main>
<footer class="foot">ENCONTREI · Projeto acadêmico de Achados e Perdidos · Demonstração local com Python + SQLite</footer>
</div><div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div id="modal-content"></div></div></div><div id="toast" class="toast"></div>
<script>
const API=''; let token=localStorage.getItem('enc_token')||''; let currentUser=JSON.parse(localStorage.getItem('enc_user')||'null'); let currentPage='explorar'; let pendingPage=null; let activeType='Todos'; let currentItem=null; let publishPhotos=[];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emojiByCategory={'Garrafas':'🧴','Chaves':'🔑','Eletrônicos':'🎧','Material escolar':'📓','Cartões':'💳','Documentos':'📄','Roupas':'🧥','Acessórios':'🎒','Outros':'📦'};
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opts.headers||{})};let res;try{res=await fetch(API+path,{...opts,headers})}catch(e){throw new Error('Não foi possível acessar o servidor local. Verifique se a janela preta do Encontrei continua aberta.')}let dat={};try{dat=await res.json()}catch(e){}if(!res.ok)throw new Error(dat.error||'Não foi possível concluir a operação.');return dat}
function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.className='toast show'+(bad?' bad':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3500)}
function userUpdate(){ $('#user-label').textContent=currentUser?currentUser.name:'Visitante';$('#login-btn').textContent=currentUser?'Sair':'Entrar';$('#nav-moderacao').style.display=currentUser&&['Moderador','Administrador'].includes(currentUser.role)?'':'none'; }
function setActiveNav(page){['explorar','publicar','meus','moderacao'].forEach(p=>{const e=$('#nav-'+p);if(e)e.classList.toggle('active',p===page)})}
function go(page){if(page!=='explorar'&&!currentUser){pendingPage=page;openLogin('Entre para acessar essa área.');return}currentPage=page;setActiveNav(page);if(page==='explorar')renderExplore();else if(page==='publicar')renderPublish();else if(page==='meus')renderMy();else if(page==='moderacao')renderModeration()}
function openModal(html){$('#modal-content').innerHTML=html;$('#overlay').classList.add('show');document.body.style.overflow='hidden'}function closeModal(){$('#overlay').classList.remove('show');document.body.style.overflow=''}
function openLogin(message=''){let html=`<div class="modal-head"><div><h2>Entrar no Encontrei</h2><p>Acesse com uma conta de demonstração.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${message?`<div class="notice info">${esc(message)}</div>`:''}<div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="estudante@campus.edu.br" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="login-password" type="password" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="login()">Entrar</button><hr class="divider"><p class="hint" style="margin-bottom:10px">Ou selecione uma conta de demonstração:</p><div class="account-list"><button class="account-choice" onclick="fillLogin('estudante@campus.edu.br','Estudante@12345')">🎓 <span><strong>Estudante</strong><small>estudante@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('lucas@campus.edu.br','Lucas@12345')">👤 <span><strong>Outro estudante</strong><small>lucas@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('moderador@campus.edu.br','Moderador@12345')">🛡️ <span><strong>Moderador</strong><small>moderador@campus.edu.br</small></span></button><button class="account-choice" onclick="fillLogin('admin@campus.edu.br','Admin@12345')">⚙️ <span><strong>Administrador</strong><small>admin@campus.edu.br</small></span></button></div><p class="hint" style="margin-top:12px">Contas fictícias para apresentação local. As senhas também estão no README.</p></div>`;openModal(html)}
function fillLogin(email,password){$('#login-email').value=email;$('#login-password').value=password;login()}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#login-email').value,password:$('#login-password').value})});token=d.token;currentUser=d.user;localStorage.setItem('enc_token',token);localStorage.setItem('enc_user',JSON.stringify(currentUser));userUpdate();closeModal();toast('Bem-vindo(a), '+currentUser.name+'!');const target=pendingPage||currentPage;pendingPage=null;go(target)}catch(e){toast(e.message,true)}}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch(e){}token='';currentUser=null;localStorage.removeItem('enc_token');localStorage.removeItem('enc_user');userUpdate();toast('Você saiu do sistema.');go('explorar')}
function loginButton(){if(currentUser)logout();else openLogin()}
function visual(item,large=false){const first=(item.photos||[])[0];if(first)return `<div class="${large?'detail-image':'card-visual'}"><img src="${esc(first)}" alt="Foto de ${esc(item.title)}"></div>`;let icon=emojiByCategory[item.category]||'📦';return large?`<div class="detail-image"><span>${icon}</span></div>`:`<div class="card-visual"><span class="card-emoji">${icon}</span><span class="badge ${item.type==='Perdido'?'lost':''}">${item.type==='Achado'?'ENCONTRADO':'PERDIDO'}</span>${item.status!=='Aberto'?`<span class="badge status">${esc(item.status)}</span>`:''}</div>`}
function renderStats(items){const found=items.filter(i=>i.type==='Achado').length,lost=items.filter(i=>i.type==='Perdido').length;return `<div class="stats"><div class="stat"><span class="stat-icon">🔎</span><small>Anúncios ativos</small><strong>${items.length}</strong></div><div class="stat"><span class="stat-icon">🤝</span><small>Itens encontrados</small><strong>${found}</strong></div><div class="stat"><span class="stat-icon">🧭</span><small>Itens perdidos</small><strong>${lost}</strong></div></div>`}
async function renderExplore(){currentPage='explorar';setActiveNav(currentPage);$('#main').innerHTML=`<section class="hero"><div><div class="eyebrow">Comunidade que se ajuda</div><h1>Perdeu algo? Vamos encontrar juntos.</h1><p>Consulte os avisos da comunidade acadêmica, encontre um objeto perdido ou ajude alguém a recuperar o que é importante.</p><button class="btn" onclick="go('publicar')">＋ Publicar um anúncio</button></div><div class="hero-art"><div class="hero-circle">🎒</div></div></section><div id="stats"></div><div class="section-head"><div><h2>Últimos anúncios</h2><p>Busque por objeto, categoria ou local para encontrar uma correspondência.</p></div><span class="demo-label">DEMONSTRAÇÃO LOCAL</span></div><div class="filters"><input class="searchbox" id="q" placeholder="⌕  O que você procura?" onkeydown="if(event.key==='Enter')loadItems()"><select id="f-category"><option value="">Todas as categorias</option><option>Garrafas</option><option>Chaves</option><option>Eletrônicos</option><option>Material escolar</option><option>Cartões</option><option>Documentos</option><option>Roupas</option><option>Acessórios</option><option>Outros</option></select><input id="f-location" placeholder="Local no campus"><select id="f-status"><option value="Aberto">Em aberto</option><option value="Todos">Todos os anúncios ativos</option></select><button class="btn btn-primary" onclick="loadItems()">Buscar</button></div><div class="tabs"><button class="chip active" id="type-Todos" onclick="setType('Todos')">Todos</button><button class="chip" id="type-Achado" onclick="setType('Achado')">✓ Encontrados</button><button class="chip" id="type-Perdido" onclick="setType('Perdido')">⌕ Perdidos</button></div><div id="items-grid" class="grid"><div class="empty">Carregando anúncios…</div></div>`;await loadItems()}
async function loadItems(){const grid=$('#items-grid');if(!grid)return;grid.innerHTML='<div class="empty">Buscando anúncios…</div>';try{const params=new URLSearchParams();const q=$('#q')?.value.trim();const cat=$('#f-category')?.value;const loc=$('#f-location')?.value.trim();const status=$('#f-status')?.value||'Aberto';if(q)params.set('q',q);if(cat)params.set('category',cat);if(loc)params.set('location',loc);if(status)params.set('status',status);if(activeType!=='Todos')params.set('type',activeType);const d=await api('/api/items?'+params.toString());const items=d.items;$('#stats').innerHTML=renderStats(items);grid.innerHTML=items.length?items.map(cardHTML).join(''):`<div class="empty"><div style="font-size:30px">⌕</div><strong>Nenhum anúncio encontrado</strong>Tente mudar os filtros ou publicar um anúncio.<div style="margin-top:15px"><button class="btn btn-soft" onclick="clearFilters()">Limpar filtros</button></div></div>`}catch(e){grid.innerHTML=`<div class="empty"><strong>Não foi possível carregar os anúncios</strong>${esc(e.message)}</div>`}}
function setType(t){activeType=t;document.querySelectorAll('.tabs .chip').forEach(b=>b.classList.remove('active'));$('#type-'+t)?.classList.add('active');loadItems()}
function clearFilters(){['q','f-category','f-location'].forEach(id=>{const e=$('#'+id);if(e)e.value=''});$('#f-status').value='Aberto';activeType='Todos';document.querySelectorAll('.tabs .chip').forEach(b=>b.classList.remove('active'));$('#type-Todos').classList.add('active');loadItems()}
function cardHTML(i){const icon=emojiByCategory[i.category]||'📦';const pic=(i.photos||[])[0];return `<article class="item-card"><div class="card-visual">${pic?`<img src="${esc(pic)}" alt="Foto de ${esc(i.title)}">`:`<span class="card-emoji">${icon}</span>`}<span class="badge ${i.type==='Perdido'?'lost':''}">${i.type==='Achado'?'ENCONTRADO':'PERDIDO'}</span>${i.status!=='Aberto'?`<span class="badge status">${esc(i.status)}</span>`:''}</div><div class="card-body"><div class="category">${esc(i.category)}</div><h3>${esc(i.title)}</h3><p>${esc(i.description.length>105?i.description.slice(0,105)+'…':i.description)}</p><div class="meta"><span>⌖ ${esc(i.location)}</span><span>◷ ${formatDate(i.event_date)}</span><span>Publicador: ${esc(i.owner_name||'Comunidade')}</span></div><div class="card-actions"><button class="btn btn-soft" onclick="detail(${i.id})">Ver detalhes</button>${i.type==='Achado'&&i.status==='Aberto'&&currentUser&&currentUser.id!==i.owner_id?`<button class="btn btn-primary" onclick="claimStart(${i.id})">Reivindicar</button>`:''}</div></div></article>`}
function formatDate(d){if(!d)return 'Data não informada';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
async function detail(id){try{let d=await api('/api/items/'+id);currentItem=d.item;const i=currentItem;const canClaim=currentUser&&currentUser.id!==i.owner_id&&i.type==='Achado'&&i.status==='Aberto';const own=currentUser&&(currentUser.id===i.owner_id||['Moderador','Administrador'].includes(currentUser.role));openModal(`<div class="modal-head"><div><h2>Detalhes do anúncio</h2><p>Confira as informações do item.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${visual(i,true)}<span class="status-pill">${esc(i.type==='Achado'?'Encontrado':'Perdido')} · ${esc(i.status)}</span><h1 class="detail-title">${esc(i.title)}</h1><span class="category">${esc(i.category)}</span><p class="detail-desc">${esc(i.description)}</p><div class="detail-meta"><div><small>LOCAL</small><strong>⌖ ${esc(i.location)}</strong></div><div><small>DATA</small><strong>${formatDate(i.event_date)}</strong></div><div><small>PUBLICADO POR</small><strong>${esc(i.owner_name||'Comunidade')}</strong></div><div><small>STATUS</small><strong>${esc(i.status)}</strong></div></div><div class="notice info">🔒 Por segurança, perguntas e respostas de verificação são privadas. Dados de contato pessoal não são exibidos.</div><div class="form-actions" style="justify-content:space-between;flex-wrap:wrap"><button class="btn btn-outline" onclick="reportItem(${i.id})">⚑ Denunciar</button><div style="display:flex;gap:8px;flex-wrap:wrap">${own?`<button class="btn btn-soft" onclick="ownerClaims(${i.id})">Ver reivindicações</button>`:''}${own&&i.status==='Aberto'?`<button class="btn btn-primary" onclick="resolveItem(${i.id})">Marcar resolvido</button>`:''}${canClaim?`<button class="btn btn-primary" onclick="closeModal();claimStart(${i.id})">Solicitar devolução</button>`:''}</div></div></div>`)}catch(e){toast(e.message,true)}}
function requireLogin(message='Entre na sua conta para continuar.'){if(!currentUser){openLogin(message);return false}return true}
async function claimStart(id){if(!requireLogin('Para solicitar a devolução, entre com uma conta de estudante.'))return;try{const d=await api('/api/items/'+id+'/verification-question');openModal(`<div class="modal-head"><div><h2>Solicitar devolução</h2><p>Confirme um detalhe que só o verdadeiro dono deve saber.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice info">A resposta não ficará visível publicamente. Se a resposta estiver correta, o publicador poderá analisar sua solicitação.</div><form onsubmit="submitClaim(event,${id})"><div class="field"><label>Pergunta de verificação</label><div style="padding:14px;background:#f4f6f1;border-radius:10px;font-size:14px;font-weight:700">${esc(d.question)}</div></div><div class="field" style="margin-top:15px"><label>Sua resposta</label><input id="claim-answer" required maxlength="250" placeholder="Digite sua resposta"></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" type="submit">Enviar solicitação</button></div></form></div>`)}catch(e){toast(e.message,true)}}
async function submitClaim(ev,id){ev.preventDefault();try{const d=await api('/api/items/'+id+'/claims',{method:'POST',body:JSON.stringify({answer:$('#claim-answer').value})});closeModal();toast(d.message);if(currentPage==='meus')renderMy()}catch(e){toast(e.message,true)}}
async function reportItem(id){if(!requireLogin('Entre para denunciar um anúncio.'))return;openModal(`<div class="modal-head"><div><h2>Denunciar anúncio</h2><p>A equipe de moderação irá analisar o caso.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><form onsubmit="submitReport(event,${id})"><div class="field"><label>Motivo da denúncia</label><textarea id="report-reason" required minlength="5" maxlength="500" placeholder="Descreva o motivo…"></textarea></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Enviar denúncia</button></div></form></div>`)}
async function submitReport(ev,id){ev.preventDefault();try{const d=await api(`/api/items/${id}/reports`,{method:'POST',body:JSON.stringify({reason:$('#report-reason').value})});closeModal();toast(d.message)}catch(e){toast(e.message,true)}}
async function resolveItem(id){if(!confirm('Marcar este anúncio como resolvido?'))return;try{const d=await api(`/api/items/${id}/resolve`,{method:'POST',body:'{}'});closeModal();toast(d.message);if(currentPage==='explorar')loadItems();else renderMy()}catch(e){toast(e.message,true)}}
function renderPublish(){currentPage='publicar';setActiveNav(currentPage);publishPhotos=[];$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Publicar um anúncio</h1><p class="page-desc">Ajude a comunidade a encontrar um objeto ou devolver algo que alguém perdeu.</p></div><span class="demo-label">NOVO ANÚNCIO</span></div><div class="panel"><form id="publish-form" onsubmit="submitPublish(event)"><div class="field full"><label>O que aconteceu?</label><div class="radio-row"><label class="radio-option"><input type="radio" name="type" value="Achado" checked onchange="toggleFound()"><span>🔎 <strong>Encontrei um objeto</strong></span></label><label class="radio-option"><input type="radio" name="type" value="Perdido" onchange="toggleFound()"><span>🎒 <strong>Perdi um objeto</strong></span></label></div></div><div class="form-grid" style="margin-top:17px"><div class="field"><label for="p-title">Título do anúncio *</label><input id="p-title" required maxlength="100" placeholder="Ex.: Garrafa térmica verde"></div><div class="field"><label for="p-category">Categoria *</label><select id="p-category" required><option value="">Selecione…</option><option>Garrafas</option><option>Chaves</option><option>Eletrônicos</option><option>Material escolar</option><option>Cartões</option><option>Documentos</option><option>Roupas</option><option>Acessórios</option><option>Outros</option></select></div><div class="field"><label for="p-location">Local no campus *</label><input id="p-location" required maxlength="160" placeholder="Ex.: Biblioteca central"></div><div class="field"><label for="p-date">Data em que foi visto *</label><input id="p-date" type="date" required></div><div class="field full"><label for="p-description">Descrição *</label><textarea id="p-description" required maxlength="1200" placeholder="Descreva cor, marca e características gerais. Não publique dados pessoais."></textarea><small>Até 1.200 caracteres. Não inclua informações de contato pessoal.</small></div><div class="field full" id="photo-field"><label for="p-photos">Fotos do item (obrigatório para itens achados) *</label><input id="p-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="previewPhotos(event)"><small>Máximo de 3 fotos, 5 MB cada, JPG, PNG ou WEBP.</small><div id="photo-preview" class="photo-preview"></div></div><div id="verification-fields" class="form-grid field full" style="padding:16px;background:#f5f7f2;border-radius:12px"><div class="field full"><label for="p-question">Pergunta de verificação *</label><input id="p-question" maxlength="250" placeholder="Ex.: Qual adesivo está na parte de baixo?"><small>Essa pergunta só será mostrada a quem solicitar a devolução; nunca aparecerá publicamente.</small></div><div class="field full"><label for="p-answer">Resposta esperada *</label><input id="p-answer" maxlength="250" placeholder="Resposta correta"><small>Será armazenada no banco local e não será exibida aos outros usuários.</small></div></div></div><div class="notice warn">Importante: documentos, cartões e eletrônicos devem ser entregues ao ponto de guarda da instituição. Não inclua números de documentos ou outros dados sensíveis na descrição.</div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="go('explorar')">Cancelar</button><button type="submit" class="btn btn-primary">Publicar anúncio</button></div></form></div>`;$('#p-date').value=new Date().toISOString().slice(0,10);toggleFound()}
function toggleFound(){const found=document.querySelector('input[name="type"]:checked').value==='Achado';$('#verification-fields').style.display=found?'grid':'none';$('#p-question').required=found;$('#p-answer').required=found;$('#photo-field').querySelector('label').textContent=found?'Fotos do item (obrigatório para itens achados) *':'Fotos do item (opcional)';}
async function previewPhotos(event){const files=[...event.target.files];if(files.length>3){toast('Selecione no máximo 3 fotos.',true);event.target.value='';publishPhotos=[];$('#photo-preview').innerHTML='';return}publishPhotos=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use fotos JPG, PNG ou WEBP.',true);event.target.value='';publishPhotos=[];return}if(file.size>5*1024*1024){toast('Cada foto deve ter no máximo 5 MB.',true);event.target.value='';publishPhotos=[];return}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});publishPhotos.push({name:file.name,mime:file.type,data});}$('#photo-preview').innerHTML=publishPhotos.map(p=>`<img src="${p.data}" alt="Prévia da foto">`).join('')}
async function submitPublish(ev){ev.preventDefault();const type=document.querySelector('input[name="type"]:checked').value;const payload={title:$('#p-title').value,type,category:$('#p-category').value,location:$('#p-location').value,event_date:$('#p-date').value,description:$('#p-description').value,photos:publishPhotos,verification_question:$('#p-question').value,verification_answer:$('#p-answer').value};try{const d=await api('/api/items',{method:'POST',body:JSON.stringify(payload)});toast(d.message);go('meus')}catch(e){toast(e.message,true)}}
async function renderMy(){currentPage='meus';setActiveNav(currentPage);$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Meus registros</h1><p class="page-desc">Acompanhe os seus anúncios e solicitações de devolução.</p></div><button class="btn btn-primary" onclick="go('publicar')">＋ Novo anúncio</button></div><div class="panel" style="margin-bottom:20px"><div class="split-head"><h2 style="font-size:17px;margin:0">Meus anúncios</h2><span class="status-pill">Publicações</span></div><div class="records" id="my-items" style="margin-top:15px">Carregando…</div><hr class="separator"><div class="split-head"><h2 style="font-size:17px;margin:0">Minhas reivindicações</h2><span class="status-pill">Solicitações</span></div><div class="records" id="my-claims" style="margin-top:15px">Carregando…</div></div>`;try{const [a,c]=await Promise.all([api('/api/my/items'),api('/api/my/claims')]);$('#my-items').innerHTML=a.items.length?a.items.map(i=>`<div class="record"><div class="record-icon">${emojiByCategory[i.category]||'📦'}</div><div class="record-main"><strong>${esc(i.title)}</strong><small>${esc(i.type)} · ${esc(i.location)} · ${formatDate(i.event_date)}</small></div><span class="status-pill">${esc(i.status)}</span><div class="record-actions"><button class="btn btn-outline btn-small" onclick="detail(${i.id})">Detalhes</button>${i.status==='Aberto'?`<button class="btn btn-soft btn-small" onclick="ownerClaims(${i.id})">Reivindicações</button><button class="btn btn-outline btn-small" onclick="resolveItem(${i.id})">Resolver</button>`:''}</div></div>`).join(''):'<div class="empty">Você ainda não publicou anúncios.</div>';$('#my-claims').innerHTML=c.claims.length?c.claims.map(cl=>`<div class="record"><div class="record-icon">🤝</div><div class="record-main"><strong>${esc(cl.item_title)}</strong><small>${esc(cl.location)} · Solicitação em ${formatDate(cl.created_at.slice(0,10))}</small></div><span class="status-pill">${esc(cl.status)}</span>${cl.status==='Aprovada'?`<button class="btn btn-soft btn-small" onclick="openMessages(${cl.id},${cl.item_id})">Abrir conversa</button>`:''}</div>`).join(''):'<div class="empty">Você ainda não fez reivindicações.</div>'}catch(e){$('#my-items').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function ownerClaims(itemId){try{const d=await api(`/api/items/${itemId}/claims`);const item=await api(`/api/items/${itemId}`);openModal(`<div class="modal-head"><div><h2>Reivindicações</h2><p>${esc(item.item.title)}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice info">As respostas de verificação não ficam disponíveis nesta lista. Analise cada solicitação com cuidado.</div><div class="records">${d.claims.length?d.claims.map(c=>`<div class="record"><div class="record-icon">👤</div><div class="record-main"><strong>${esc(c.claimant_name)}</strong><small>Enviada em ${formatDate(c.created_at.slice(0,10))}</small></div><span class="status-pill">${esc(c.status)}</span>${c.status==='Pendente'?`<div class="record-actions"><button class="btn btn-primary btn-small" onclick="decideClaim(${c.id},'Aprovada',${itemId})">Aprovar</button><button class="btn btn-outline btn-small" onclick="decideClaim(${c.id},'Recusada',${itemId})">Recusar</button></div>`:''}${c.status==='Aprovada'?`<button class="btn btn-soft btn-small" onclick="openMessages(${c.id},${itemId})">Conversa</button>`:''}</div>`).join(''):'<div class="empty">Ainda não há reivindicações para este item.</div>'}</div></div>`)}catch(e){toast(e.message,true)}}
async function decideClaim(id,decision,itemId){let note='';if(decision==='Recusada'){note=prompt('Motivo da recusa (opcional):')||''}try{const d=await api(`/api/claims/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);ownerClaims(itemId)}catch(e){toast(e.message,true)}}
async function openMessages(claimId,itemId){try{let d=await api(`/api/claims/${claimId}/messages`);openModal(`<div class="modal-head"><div><h2>Conversa sobre o item</h2><p>Combine a entrega sem compartilhar contato pessoal.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div id="messages-box" class="records">${d.messages.length?d.messages.map(m=>`<div class="record"><div class="record-main"><strong>${esc(m.sender_name)} ${m.sender_id===currentUser.id?'(você)':''}</strong><small>${esc(m.body)} · ${esc(m.created_at.replace('T',' '))}</small></div></div>`).join(''):'<div class="empty">Nenhuma mensagem ainda. Combine aqui a entrega.</div>'}</div><form onsubmit="sendMessage(event,${claimId},${itemId})" style="margin-top:14px"><div class="field"><label>Mensagem</label><textarea id="message-body" maxlength="500" required placeholder="Digite uma mensagem curta…"></textarea></div><div class="form-actions"><button class="btn btn-primary">Enviar mensagem</button></div></form></div>`)}catch(e){toast(e.message,true)}}
async function sendMessage(ev,claimId,itemId){ev.preventDefault();try{const d=await api(`/api/claims/${claimId}/messages`,{method:'POST',body:JSON.stringify({body:$('#message-body').value})});toast(d.message);openMessages(claimId,itemId)}catch(e){toast(e.message,true)}}
async function renderModeration(){currentPage='moderacao';setActiveNav(currentPage);if(!currentUser||!['Moderador','Administrador'].includes(currentUser.role)){go('explorar');return}$('#main').innerHTML=`<div class="section-head"><div><h1 class="page-title">Painel de moderação</h1><p class="page-desc">Analise denúncias e registre as decisões tomadas sobre os anúncios.</p></div><span class="demo-label">MODERAÇÃO</span></div><div class="panel"><h2 style="font-size:17px;margin-top:0">Denúncias pendentes</h2><div id="reports-list" class="records">Carregando…</div></div>`;try{const d=await api('/api/moderation/reports');$('#reports-list').innerHTML=d.reports.length?d.reports.map(r=>`<div class="record"><div class="record-icon">⚑</div><div class="record-main"><strong>${esc(r.item_title)}</strong><small>Denunciado por ${esc(r.reporter_name)} · ${esc(r.reason)}</small></div><div class="record-actions"><button class="btn btn-outline btn-small" onclick="reviewReport(${r.id},'Manter anúncio')">Manter anúncio</button><button class="btn btn-danger btn-small" onclick="reviewReport(${r.id},'Ocultar anúncio')">Ocultar</button></div></div>`).join(''):'<div class="empty"><div style="font-size:30px">✓</div><strong>Nenhuma denúncia pendente</strong>O painel será atualizado quando houver denúncias.</div>'}catch(e){$('#reports-list').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function reviewReport(id,decision){const note=prompt('Justificativa obrigatória para registrar a ação:');if(!note||!note.trim()){toast('Informe uma justificativa para continuar.',true);return}try{const d=await api(`/api/reports/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(d.message);renderModeration()}catch(e){toast(e.message,true)}}
async function startup(){userUpdate();if(token){try{const d=await api('/api/me');currentUser=d.user;localStorage.setItem('enc_user',JSON.stringify(currentUser));userUpdate()}catch(e){token='';currentUser=null;localStorage.removeItem('enc_token');localStorage.removeItem('enc_user');userUpdate()}}await renderExplore()}
$('#login-btn').addEventListener('click',loginButton);startup();
</script></body></html>
