openapi: 3.0.3
info:
  title: Encontrei — API local
  version: 1.0.0
  description: Contrato OpenAPI da edição acadêmica Python + SQLite executada localmente em http://127.0.0.1:8000.
    A API não deve ser exposta diretamente à internet. Rotas, campos e regras completos também estão em docs/api/api-local.md.
servers:
- url: http://127.0.0.1:8000
  description: Servidor local de demonstração
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque token retornado por /api/login
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Success:
      type: object
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ItemCreateRequest:
      type: object
      required:
      - title
      - type
      - category
      - description
      - location
      - event_date
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        type:
          type: string
          enum:
          - Achado
          - Perdido
        category:
          type: string
        description:
          type: string
        location:
          type: string
        event_date:
          type: string
          format: date
        photos:
          type: array
          maxItems: 3
          items:
            type: object
            required:
            - mime
            - data
            properties:
              mime:
                type: string
                enum:
                - image/jpeg
                - image/png
                - image/webp
              data:
                type: string
                description: Data URL de imagem em Base64
        verification_question:
          type: string
        verification_answer:
          type: string
