# REFERÊNCIA HISTÓRICA: este contrato foi elaborado para a arquitetura original Laravel/MySQL.
# Ele não descreve exatamente a API da implementação local Python + SQLite.
# Para as rotas atuais, consulte docs/api/api-local.md.
openapi: 3.0.3
info:
  title: API — Achados e Perdidos
  version: 1.0.0
  description: API REST do MVP acadêmico para anúncios, reivindicações, denúncias, notificações e administração de achados e perdidos no campus.
servers:
  - url: http://localhost:8000/api
    description: Ambiente local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  schemas:
    Message:
      type: object
      properties:
        message: { type: string, example: Solicitação processada com sucesso. }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [ACHADO, PERDIDO] }
        titulo: { type: string, maxLength: 140 }
        descricao: { type: string }
        data_ocorrencia: { type: string, format: date }
        status: { type: string, enum: [ABERTO, PONTO_GUARDA, RESOLVIDO, EXPIRADO, OCULTO] }
        categoria: { type: object }
        local: { type: object }
        fotos: { type: array, maxItems: 3, items: { type: object } }
        pergunta_verificacao:
          type: string
          description: Nunca é retornada pela API pública.
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
paths:
  /auth/register:
    post:
      security: []
      summary: Criar conta institucional pendente de verificação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha, senha_confirmation]
              properties:
                nome: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                senha: { type: string, minLength: 8, format: password }
                senha_confirmation: { type: string, format: password }
      responses:
        '201': { description: Conta criada; no ambiente local, o token de teste é retornado na resposta. }
        '422': { description: E-mail/domínio ou campos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /auth/login:
    post:
      security: []
      summary: Autenticar uma conta ativa
      description: Limitado a cinco tentativas por minuto por e-mail e IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '200': { description: Token Bearer e perfil público do usuário. }
        '403': { description: Conta pendente, suspensa ou inativa. }
        '422': { description: Credenciais inválidas. }
  /auth/verify-email:
    post:
      security: []
      summary: Verificar e-mail e ativar conta
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: Conta ativa e token Bearer. }
        '422': { description: Token inválido ou expirado. }
  /auth/resend-verification:
    post:
      security: []
      summary: Reenviar link de verificação
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Mensagem neutra para não revelar se a conta existe. }
  /auth/me:
    get:
      summary: Consultar usuário autenticado
      responses:
        '200': { description: Perfil do usuário. }
        '401': { description: Token ausente ou inválido. }
  /auth/logout:
    post:
      summary: Revogar token de acesso atual
      responses: { '200': { description: Sessão encerrada. } }
  /auth/preferences:
    patch:
      summary: Atualizar preferência de e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [emails_ativados], properties: { emails_ativados: { type: boolean } } }
      responses: { '200': { description: Preferência salva. } }
  /categories:
    get:
      security: []
      summary: Listar categorias ativas
      responses: { '200': { description: Lista de categorias. } }
  /locations:
    get:
      security: []
      summary: Listar locais ativos do campus
      responses: { '200': { description: Lista de locais. } }
  /guard-points:
    get:
      security: []
      summary: Listar pontos de guarda ativos
      responses: { '200': { description: Lista de pontos de guarda. } }
  /items:
    get:
      security: []
      summary: Buscar e filtrar anúncios públicos
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Busca por título e descrição. }
        - { in: query, name: tipo, schema: { type: string, enum: [ACHADO, PERDIDO] } }
        - { in: query, name: categoria_id, schema: { type: string, format: uuid } }
        - { in: query, name: local_id, schema: { type: string, format: uuid } }
        - { in: query, name: data_inicio, schema: { type: string, format: date } }
        - { in: query, name: data_fim, schema: { type: string, format: date } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Página de anúncios ativos. } }
    post:
      summary: Publicar item achado ou perdido (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, titulo, descricao, categoria_id, local_id, data_ocorrencia]
              properties:
                tipo: { type: string, enum: [ACHADO, PERDIDO] }
                titulo: { type: string, minLength: 3, maxLength: 140 }
                descricao: { type: string, minLength: 5, maxLength: 5000 }
                categoria_id: { type: string, format: uuid }
                local_id: { type: string, format: uuid }
                data_ocorrencia: { type: string, format: date }
                pergunta_verificacao: { type: string, description: Obrigatória para ACHADO. }
                resposta_verificacao: { type: string, description: Obrigatória para ACHADO; armazenada criptografada. }
                ponto_guarda_id: { type: string, format: uuid, description: Apenas moderadores/administradores. }
                fotos[]: { type: array, maxItems: 3, items: { type: string, format: binary } }
      responses:
        '201': { description: Anúncio criado; até cinco correspondências podem acompanhar a resposta para um item perdido. }
        '422': { description: Validação ou regra de negócio violada. }
  /items/{id}:
    get:
      security: []
      summary: Consultar detalhes públicos do item
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Detalhes sem pergunta/resposta de verificação. }, '404': { description: Anúncio indisponível. } }
    patch:
      summary: Editar título, descrição e fotos do anúncio próprio
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                titulo: { type: string, maxLength: 140 }
                descricao: { type: string, maxLength: 5000 }
                fotos[]: { type: array, maxItems: 3, items: { type: string, format: binary } }
      responses: { '200': { description: Anúncio atualizado. }, '403': { description: Não é o publicador. }, '422': { description: Anúncio não está aberto ou dados inválidos. } }
  /items/{id}/verification-question:
    get:
      summary: Obter a pergunta de verificação privada antes da reivindicação
      description: Exige autenticação; nunca retorna a resposta esperada. Bloqueia o publicador, itens fechados e itens com reivindicação aprovada.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pergunta que o usuário deve responder para reivindicar o item. }
        '401': { description: Autenticação necessária. }
        '422': { description: O item não aceita reivindicações ou pertence ao solicitante. }
  /items/{id}/claims:
    post:
      summary: Criar reivindicação para item achado
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [resposta_verificacao], properties: { resposta_verificacao: { type: string, maxLength: 2000 } } }
      responses: { '201': { description: Reivindicação pendente. }, '422': { description: Item próprio, fechado ou reivindicação ativa duplicada. } }
  /claims/{id}/decision:
    patch:
      summary: Aprovar ou recusar reivindicação
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisao]
              properties:
                decisao: { type: string, enum: [APROVAR, RECUSAR] }
                motivo_recusa: { type: string, maxLength: 1000 }
      responses: { '200': { description: Decisão registrada. }, '403': { description: Perfil sem permissão. } }
  /claims/{id}/messages:
    get:
      summary: Consultar chat de reivindicação aprovada
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Mensagens sem contatos pessoais. }, '422': { description: Chat ainda não liberado. } }
    post:
      summary: Enviar mensagem curta no chat interno
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [conteudo], properties: { conteudo: { type: string, maxLength: 500 } } }
      responses: { '201': { description: Mensagem enviada. } }
  /claims/{id}/returned:
    post:
      summary: Marcar a devolução como concluída
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Item resolvido e removido da busca pública. } }
  /my-items:
    get:
      summary: Consultar anúncios e reivindicações do usuário autenticado
      responses: { '200': { description: Lista de anúncios próprios e reivindicações relacionadas. } }
  /items/{id}/reports:
    post:
      summary: Denunciar anúncio
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [motivo], properties: { motivo: { type: string, minLength: 5, maxLength: 2000 } } }
      responses: { '201': { description: Denúncia criada. }, '409': { description: Denúncia duplicada para o mesmo usuário e item. } }
  /notifications:
    get:
      summary: Consultar notificações e quantidade não lida
      responses: { '200': { description: Notificações recentes do usuário. } }
  /notifications/{id}/read:
    patch:
      summary: Marcar notificação como lida
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Notificação marcada. } }
  /notifications/read-all:
    post:
      summary: Marcar todas as notificações como lidas
      responses: { '200': { description: Notificações marcadas. } }
  /moderation/reports:
    get:
      summary: Listar denúncias para moderação
      responses: { '200': { description: Apenas moderador/administrador. }, '403': { description: Perfil comum. } }
  /moderation/claims:
    get:
      summary: Listar reivindicações encaminhadas para análise de moderação
      description: Exige perfil moderador/administrador. Inclui reivindicações pendentes encaminhadas por falta de resposta, reivindicações de itens guardados e devoluções desses itens que ainda precisam ser concluídas.
      responses:
        '200': { description: Lista paginada de reivindicações encaminhadas e reivindicações aprovadas de itens guardados que aguardam confirmação de devolução. }
        '403': { description: Perfil sem permissão. }
  /moderation/reports/{id}:
    patch:
      summary: Resolver denúncia e registrar justificativa
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [acao, justificativa], properties: { acao: { type: string, enum: [REMOVER_ANUNCIO, MANTER_ANUNCIO] }, justificativa: { type: string, minLength: 5 } } }
      responses: { '200': { description: Ação de moderação registrada. } }
  /moderation/log:
    get:
      summary: Consultar histórico de ações de moderação
      responses: { '200': { description: Histórico paginado. } }
  /moderation/guard-items:
    post:
      summary: Cadastrar objeto recebido fisicamente no ponto de guarda
      description: Exige perfil moderador/administrador, tipo ACHADO e ponto de guarda ativo associado ao local informado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, titulo, descricao, categoria_id, local_id, data_ocorrencia, ponto_guarda_id]
              properties:
                tipo: { type: string, enum: [ACHADO] }
                titulo: { type: string, minLength: 3, maxLength: 140 }
                descricao: { type: string, minLength: 5, maxLength: 5000 }
                categoria_id: { type: string, format: uuid }
                local_id: { type: string, format: uuid }
                data_ocorrencia: { type: string, format: date }
                pergunta_verificacao: { type: string, minLength: 8, maxLength: 255 }
                resposta_verificacao: { type: string, maxLength: 1000 }
                ponto_guarda_id: { type: string, format: uuid }
                fotos[]: { type: array, minItems: 1, maxItems: 3, items: { type: string, format: binary } }
      responses: { '201': { description: Item cadastrado no ponto de guarda. }, '403': { description: Perfil sem permissão. }, '422': { description: Dados inválidos ou ponto/local incompatíveis. } }
  /admin/categories:
    get:
      summary: Listar todas as categorias, incluindo inativas
      responses: { '200': { description: Lista administrativa de categorias. }, '403': { description: Apenas administrador. } }
    post:
      summary: Criar categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 80 }
                descricao: { type: string, maxLength: 255, nullable: true }
      responses: { '201': { description: Categoria criada. }, '422': { description: Nome duplicado ou dados inválidos. } }
  /admin/categories/{id}:
    patch:
      summary: Atualizar categoria ou ativação sem apagar anúncios antigos
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 80 }
                descricao: { type: string, maxLength: 255, nullable: true }
                ativo: { type: boolean }
      responses: { '200': { description: Categoria atualizada. }, '404': { description: Categoria não encontrada. }, '422': { description: Dados inválidos. } }
  /admin/locations:
    get: { summary: Listar locais administrativos, responses: { '200': { description: Locais e pontos vinculados. } } }
    post:
      summary: Criar local do campus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 120 }
                bloco: { type: string, maxLength: 80, nullable: true }
      responses: { '201': { description: Local criado. }, '422': { description: Dados inválidos. } }
  /admin/locations/{id}:
    patch:
      summary: Atualizar ou desativar local
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 120 }
                bloco: { type: string, maxLength: 80, nullable: true }
                ativo: { type: boolean }
      responses: { '200': { description: Local atualizado. }, '404': { description: Local não encontrado. } }
  /admin/guard-points:
    get: { summary: Listar pontos de guarda administrativos, responses: { '200': { description: Pontos de guarda e seus locais. } } }
    post:
      summary: Criar ponto de guarda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_id, nome]
              properties:
                local_id: { type: string, format: uuid }
                nome: { type: string, maxLength: 120 }
                referencia: { type: string, maxLength: 255, nullable: true }
      responses: { '201': { description: Ponto criado. }, '422': { description: Local inexistente ou dados inválidos. } }
  /admin/guard-points/{id}:
    patch:
      summary: Atualizar ou desativar ponto de guarda
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                local_id: { type: string, format: uuid }
                nome: { type: string, maxLength: 120 }
                referencia: { type: string, maxLength: 255, nullable: true }
                ativo: { type: boolean }
      responses: { '200': { description: Ponto atualizado. }, '404': { description: Ponto não encontrado. } }
  /admin/users:
    get:
      summary: Listar usuários
      responses: { '200': { description: Lista administrativa sem hashes de senha ou tokens. }, '403': { description: Apenas administrador. } }
  /admin/users/{id}/role:
    patch:
      summary: Alterar papel de usuário
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [papel], properties: { papel: { type: string, enum: [USUARIO, MODERADOR, ADMINISTRADOR] } } }
      responses: { '200': { description: Perfil atualizado. }, '404': { description: Usuário não encontrado. } }
  /admin/users/{id}/status:
    patch:
      summary: Suspender ou reativar usuário e revogar tokens ao suspender
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [ATIVO, SUSPENSO] } } }
      responses: { '200': { description: Status atualizado. }, '404': { description: Usuário não encontrado. } }
  /admin/domains:
    get: { summary: Listar domínios institucionais permitidos, responses: { '200': { description: Domínios cadastrados. } } }
    post:
      summary: Adicionar domínio institucional permitido para cadastro
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [dominio], properties: { dominio: { type: string, maxLength: 190, example: alunos.instituicao.br } } }
      responses: { '201': { description: Domínio adicionado. }, '422': { description: Domínio inválido ou duplicado. } }
  /admin/domains/{id}:
    patch:
      summary: Ativar ou desativar domínio institucional
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ativo], properties: { ativo: { type: boolean } } }
      responses: { '200': { description: Domínio atualizado. }, '404': { description: Domínio não encontrado. } }
